name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2026-11-11"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"			#d1数据库绑定名默认不可修改
database_name = "cloudmail"		#d1数据库名字
database_id = "58c60477-b5f8-49cc-9081-a3d800f9acd1"		#d1数据库id

[[kv_namespaces]]
binding = "kv"			#kv绑定名默认不可修改
id = "95f6541b073b47bbb4c01aa69300b0ab"					#kv数据库id

[[r2_buckets]]
binding = "r2"			#r2对象存储绑定名默认不可修改
bucket_name = "cloudmail"		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[[send_email]]
name = "forward"		#站内转发到已验证的其他邮箱，不限制单个地址

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#是否开启分析数据缓存
orm_log = false			#是否sql日志
domain = ["lev5.cn","le1992.ccwu.cc","leboot1234.us.ci","leboot1234.ccwu.cc","led2026.ccwu.cc","led2026.us.ci","ledehui.cc.cd","ledehui.de5.net"]				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
admin = "admin@lev5.cn"					#管理员的邮箱	示例: admin@example.com
jwt_secret = "eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJuYW1lIjoiSm9obiIsImFkbWluIjp0cnVlfQ.750TGOTekOsmHVLgh61bn3FoHSJxTVsWFeBZy1RXyMFTr0ol1ByByqzm5-_MQCEMcj-v9o37pICNB36f1vuHKQ"			#jwt令牌的密钥,随便填一串字符串

[build]
command = "pnpm --prefix ../mail-vue install --frozen-lockfile && pnpm --prefix ../mail-vue run build"
